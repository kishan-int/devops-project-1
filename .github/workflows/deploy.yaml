name: CI/CD Pipeline

on:
  push:
    branches: [main]                          #Triggers pipeline on every push to main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code.                    #Pulls your code into the runner
      uses: actions/checkout@v4

    - name: Confifure AWS Crdentials          #Authenticates with AWS using your secrets
      uses: aws-actions/configure-aws-credentials@v3
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID}}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY}}
        aws-region: ${{ secrets.AWS_REGION}}

    - name: Login to Amazon ECR               #Logs Docker into your ECR registry
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag and push image to ECR  #Builds Docker image and pushes to ECR
      env: 
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry}}
        ECR_REPOSITORY: flask-app
        IMAGE: ${{ github.sha }}

      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo  "IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT