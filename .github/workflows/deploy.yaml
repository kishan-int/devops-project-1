name: CI/CD Pipeline

on:
  push:
    branches: [main]                          #Triggers pipeline on every push to main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code.                    #Pulls your code into the runner
      uses: actions/checkout@v4

    - name: Confifure AWS Crdentials          #Authenticates with AWS using your secrets
      uses: aws-actions/configure-aws-credentials@v3
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID}}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY}}
        aws-region: ${{ secrets.AWS_REGION}}

    - name: Login to Amazon ECR               #Logs Docker into your ECR registry
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag and push image to ECR
      run: |
        IMAGE_TAG=${{ github.sha }}
        ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
        docker build -t $ECR_REGISTRY/flask-app:$IMAGE_TAG -t $ECR_REGISTRY/flask-app:latest .
        docker push $ECR_REGISTRY/flask-app:$IMAGE_TAG
        docker push $ECR_REGISTRY/flask-app:latest

  deploy-to-ec2:
   runs-on: ubuntu-latest
   needs: build-and-push

   steps:
   - name: Deploy to EC2
     uses: appleboy/ssh-action@v1.0.0
     with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin 967427982200.dkr.ecr.eu-north-1.amazonaws.com
          docker pull 967427982200.dkr.ecr.eu-north-1.amazonaws.com/flask-app:latest
          docker stop flask-app || true
          docker rm flask-app || true
          docker run -d -p 5000:5000 --name flask-app 967427982200.dkr.ecr.eu-north-1.amazonaws.com/flask-app:latest 