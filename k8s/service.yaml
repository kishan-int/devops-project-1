apiVersion: v1             # K8s API version for Services
kind: Service              # Type of K8s object
metadata:
  name: flask-app-service  # Name of your service
spec:
  selector:
    app: flask-app         # Connects to pods with this label
  ports:
  - port: 80               # Port exposed outside
    targetPort: 5000       # Port your Flask app runs on inside container
  type: NodePort           # Exposes service on each node's IP